<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokeGuru — The Pokémon Card Guru</title>
    <meta
      name="description"
      content="A fast, open Pokémon TCG card database: search every card, browse every set, check Cardmarket reference prices in GBP and track your collection privately."
    />
    <meta name="keywords" content="pokemon, tcg, cards, database, pokemon cards, collector, pricing, cardmarket, sets" />
    <meta name="theme-color" content="#08090d" />
    <meta name="color-scheme" content="dark" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PokeGuru" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph / Twitter (absolute URLs are added at runtime from the real origin) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PokeGuru" />
    <meta property="og:title" content="PokeGuru — The Pokémon Card Guru" />
    <meta
      property="og:description"
      content="Search Pokémon cards, browse sets and check Cardmarket reference prices in GBP — with a private, local-only collection vault."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PokeGuru — The Pokémon Card Guru" />
    <meta
      name="twitter:description"
      content="A fast, open Pokémon TCG database with dated GBP reference prices."
    />

    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />

    <!-- Capture beforeinstallprompt before React loads (see public/pwa-capture.js).
         Must stay a plain external script in <head> so it runs during parsing
         and passes the strict CSP (script-src 'self'). -->
    <script src="%BASE_URL%pwa-capture.js"></script>

    <link rel="preconnect" href="https://api.tcgdex.net" crossorigin />
    <link rel="preconnect" href="https://assets.tcgdex.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />

    <!-- GitHub Pages deep-link restore (no-op on other hosts) -->
    <script>
      (function (location) {
        if (location.search[1] === "/") {
          var decoded = location.search
            .slice(1)
            .split("&")
            .map(function (segment) {
              return segment.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, location.pathname.slice(0, -1) + decoded + location.hash);
        }
      })(window.location);
    </script>

    <!--SITE_JSONLD-->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif; color: #e7e9ee; background: #0f1115">
        PokeGuru needs JavaScript to search the Pokémon TCG card database.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
