name: asset-probe

on:
  push:
    branches: ["arena/c8ce43cc-pokeguru"]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe TCGdex image variants
        run: |
          set -u
          for u in \
            "https://assets.tcgdex.net/en/sm/smp/SM108/low.webp" \
            "https://assets.tcgdex.net/en/sm/smp/SM108/low.png" \
            "https://assets.tcgdex.net/en/sm/smp/SM108/high.webp" \
            "https://assets.tcgdex.net/en/sv/sv06.5/090/low.webp" \
            "https://assets.tcgdex.net/en/swsh/swsh3/136/low.webp" \
            "https://assets.tcgdex.net/en/base/base1/4/low.webp" \
            "https://assets.tcgdex.net/univ/sm/smp/symbol.webp" \
            "https://assets.tcgdex.net/en/sm/smp/logo.webp" \
          ; do
            out=$(curl -sSL --max-time 20 -o /dev/null -w "%{http_code} %{content_type} %{size_download}" "$u" || echo "curl-failed")
            echo "$u -> $out"
          done
