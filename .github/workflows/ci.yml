name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Mirrors the Vercel project so robots.txt/sitemap.xml are generated
          # and verified in CI.
          VITE_PUBLIC_SITE_URL: https://pokeguru.vercel.app

      - name: Check build output
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/offline.html
          test -f dist/manifest.webmanifest
          test -f dist/pwa-capture.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          # The manifest must be installable: name, 192 + 512 icons, and an
          # id/start_url/scope that agree (all inside the deployment base).
          node -e "const m=require('./dist/manifest.webmanifest'); const sizes=m.icons.map(i=>i.sizes); if(!m.name||!m.short_name) throw new Error('manifest name missing'); if(!sizes.includes('192x192')||!sizes.includes('512x512')) throw new Error('manifest icons missing'); if(m.id!==m.start_url||m.start_url!==m.scope) throw new Error('manifest id/start_url/scope mismatch'); console.log('manifest ok:', m.id)"
          # Production sourcemaps must not ship.
          if find dist -name '*.map' | grep -q .; then
            echo "Unexpected sourcemap in dist" >&2
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
